<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Uniluva — Cargador de contenido inicial</title>
<style>
body{font-family:Inter,system-ui,sans-serif;background:#f7f8fc;color:#171725;margin:0;padding:30px}
.wrap{max-width:760px;margin:auto}
.card{background:white;border:1px solid #e8eaf2;border-radius:22px;padding:24px;box-shadow:0 18px 50px rgba(34,38,68,.08);margin-bottom:18px}
h1{margin:0 0 8px}p{color:#73778a;line-height:1.55}
button{border:0;border-radius:13px;padding:12px 16px;font-weight:800;cursor:pointer}
.primary{background:linear-gradient(135deg,#5b3df5,#7658f7);color:white}
.secondary{background:#f0f2f8;color:#4f5364;margin-left:8px}
#status{white-space:pre-wrap;background:#f6f7fb;border-radius:14px;padding:14px;min-height:100px;font-family:ui-monospace,monospace;font-size:12px;color:#4f5364}
.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#eeeaff;color:#5b3df5;font-size:12px;font-weight:800}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <span class="badge">Herramienta editorial</span>
    <h1>Cargar contenido inicial en Uniluva</h1>
    <p>Inicia sesión con la cuenta que quieras usar como <strong>Uniluva Oficial</strong>. Luego carga las comunidades y publicaciones iniciales. Todos los posts quedarán asociados al UID de esa cuenta.</p>
    <button class="primary" id="loginBtn">Iniciar sesión con Google</button>
    <button class="secondary" id="seedBtn" disabled>Cargar contenido</button>
  </div>
  <div class="card">
    <strong>Estado</strong>
    <div id="status">Esperando inicio de sesión...</div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
import { getFirestore, doc, setDoc, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

const firebaseConfig = {"apiKey": "AIzaSyCeKgsIeYLulHGMhf82EWzA3KBPznX7bSU", "authDomain": "nuvia-b09c6.firebaseapp.com", "projectId": "nuvia-b09c6", "storageBucket": "nuvia-b09c6.firebasestorage.app", "messagingSenderId": "147115063936", "appId": "1:147115063936:web:d8501e839eecad07cf8465", "measurementId": "G-9F9N01E96C"};
const communities = [{"id": "locucion-radio", "name": "Locución y radio", "description": "Voces, técnica, programas, radio, podcasts y experiencias de audio."}, {"id": "fotografia-urbana", "name": "Fotografía urbana", "description": "Ideas, técnica, lugares y proyectos visuales."}, {"id": "tecnologia", "name": "Tecnología", "description": "Productos, desarrollo, inteligencia artificial y aprendizaje digital."}, {"id": "musica-80", "name": "Música de los 80", "description": "Canciones, álbumes, artistas e historias de una década inolvidable."}, {"id": "cine", "name": "Cine", "description": "Películas, análisis, recomendaciones y conversaciones sobre cine."}, {"id": "chile", "name": "Chile", "description": "Lugares, cultura, iniciativas y experiencias de Chile."}, {"id": "ideas-que-aportan", "name": "Ideas que aportan", "description": "Reflexiones, hábitos, aprendizajes y pequeñas ideas útiles para la vida cotidiana."}];
const posts = [{"community": "Ideas que aportan", "text": "Bienvenidos a Uniluva. Este espacio nace con una idea simple: una buena publicación debería poder encontrar a las personas que realmente necesitan verla. Aquí queremos conectar, descubrir y aportar."}, {"community": "Ideas que aportan", "text": "Pregunta del día: ¿qué consejo pequeño te dieron alguna vez y terminó siendo mucho más útil de lo que imaginabas? Compártelo. Tal vez hoy le sirva a otra persona."}, {"community": "Ideas que aportan", "text": "No todo lo que aporta tiene que ser extraordinario. A veces una recomendación, una explicación clara o una experiencia contada con honestidad puede cambiarle el día a alguien."}, {"community": "Ideas que aportan", "text": "Un buen hábito para empezar la semana: antes de abrir todas tus pendientes, escribe solo las tres cosas que realmente necesitan avanzar hoy. Menos ruido, más foco."}, {"community": "Ideas que aportan", "text": "Descubrir algo nuevo también es una forma de cuidarnos de la rutina. Hoy prueba escuchar un género musical distinto, aprender una palabra nueva o leer sobre un tema que nunca buscarías normalmente."}, {"community": "Tecnología", "text": "Tecnología útil no siempre significa tecnología compleja. La mejor herramienta es muchas veces la que te ahorra pasos, te ayuda a pensar mejor o te devuelve tiempo."}, {"community": "Tecnología", "text": "Consejo digital: activa la verificación en dos pasos en tus cuentas importantes. Es una de las medidas más simples para mejorar tu seguridad online."}, {"community": "Tecnología", "text": "¿Qué aplicación utilizas todos los días y casi nadie conoce? Comparte una herramienta que realmente te haya simplificado una tarea."}, {"community": "Tecnología", "text": "Aprender tecnología puede empezar por proyectos pequeños: una página web personal, automatizar una tarea repetitiva o entender cómo funciona una herramienta que usas todos los días."}, {"community": "Tecnología", "text": "La inteligencia artificial puede ser más útil cuando la usamos para ampliar nuestro criterio, no para reemplazarlo. Una buena práctica: pedir alternativas, comparar y verificar antes de decidir."}, {"community": "Fotografía urbana", "text": "Reto fotográfico: durante un día intenta fotografiar solo reflejos. Ventanas, charcos, espejos, vitrinas. Cambiar una regla pequeña puede obligarte a mirar la ciudad de otra manera."}, {"community": "Fotografía urbana", "text": "Una fotografía no necesita un lugar extraordinario. A veces la luz, el encuadre y el momento convierten una esquina cotidiana en algo completamente nuevo."}, {"community": "Fotografía urbana", "text": "Consejo simple para fotos con celular: antes de disparar, limpia la lente. Parece obvio, pero puede mejorar mucho el contraste y la nitidez."}, {"community": "Fotografía urbana", "text": "¿Qué lugar de tu ciudad recomendarías para salir a caminar con una cámara, aunque sea la del teléfono? Cuéntanos qué hace especial a ese lugar."}, {"community": "Locución y radio", "text": "Para sonar más natural frente al micrófono, prueba imaginar que le hablas a una sola persona y no a una audiencia completa. La voz suele cambiar inmediatamente."}, {"community": "Locución y radio", "text": "Ejercicio de voz: lee un mismo texto tres veces. Primero como noticia, luego como conversación y finalmente como relato. Escucha cómo cambia el ritmo, la intención y la respiración."}, {"community": "Locución y radio", "text": "La pausa también comunica. No todo espacio debe llenarse con palabras. En radio y podcast, un segundo de silencio bien usado puede dar más fuerza a una idea."}, {"community": "Locución y radio", "text": "¿Qué voz, programa o locutor recuerdas con cariño? Cuéntanos qué tenía esa forma de comunicar que todavía recuerdas."}, {"community": "Música de los 80", "text": "Abrimos conversación: si tuvieras que presentar la música de los 80 a alguien que nunca la ha escuchado, ¿con qué tres canciones comenzarías?"}, {"community": "Música de los 80", "text": "Más allá de la nostalgia, los 80 fueron una década de enorme experimentación sonora: sintetizadores, cajas de ritmo, new wave, pop, rock y una identidad visual muy marcada."}, {"community": "Música de los 80", "text": "Hay canciones que funcionan como máquinas del tiempo. ¿Qué tema de los 80 te lleva inmediatamente a un recuerdo, lugar o persona?"}, {"community": "Música de los 80", "text": "Idea para este fin de semana: arma una lista de diez canciones de los 80 que nunca hayan sido grandes éxitos, pero que merezcan volver a escucharse."}, {"community": "Cine", "text": "Una buena película no siempre es la que más nos entretiene; a veces es la que sigue dando vueltas en la cabeza varios días después. ¿Cuál fue la última que te produjo eso?"}, {"community": "Cine", "text": "Reto de cine: vuelve a ver una película que te gustaba hace diez años. Es interesante descubrir cuánto cambia una historia cuando cambia quien la mira."}, {"community": "Cine", "text": "Recomienda una película sin contar su argumento. Solo dinos qué sensación deja, para quién la recomendarías y por qué vale la pena verla."}, {"community": "Cine", "text": "El sonido también cuenta historias. La próxima vez que veas una película, intenta fijarte durante una escena en todo lo que escuchas además de los diálogos."}, {"community": "Chile", "text": "Chile está lleno de lugares que no siempre aparecen en las guías. ¿Qué rincón de tu comuna o ciudad recomendarías visitar y por qué?"}, {"community": "Chile", "text": "Idea comunitaria: comparte un emprendimiento, iniciativa cultural o proyecto local que merezca más visibilidad. Las buenas recomendaciones también construyen comunidad."}, {"community": "Chile", "text": "¿Qué tradición, comida, expresión o costumbre chilena crees que sería interesante explicarle a alguien que visita el país por primera vez?"}, {"community": "Chile", "text": "A veces conocemos más destinos lejanos que nuestro propio entorno. Este fin de semana prueba caminar por un barrio cercano como si fueras turista: observa arquitectura, plazas, negocios e historias."}];

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();
provider.setCustomParameters({prompt:"select_account"});

let currentUser = null;
const status = document.getElementById("status");
const loginBtn = document.getElementById("loginBtn");
const seedBtn = document.getElementById("seedBtn");

function log(msg) {
  status.textContent += "\n" + msg;
  status.scrollTop = status.scrollHeight;
}

loginBtn.onclick = async () => {
  try {
    const result = await signInWithPopup(auth, provider);
    currentUser = result.user;
    status.textContent = "Sesión iniciada como: " + (currentUser.email || currentUser.uid);
    seedBtn.disabled = false;
  } catch (err) {
    status.textContent = "Error al iniciar sesión: " + (err.code || err.message);
  }
};

seedBtn.onclick = async () => {
  if (!currentUser) return;
  seedBtn.disabled = true;
  loginBtn.disabled = true;
  status.textContent = "Comenzando carga...";

  try {
    // Ensure official profile exists/updated
    await setDoc(doc(db, "users", currentUser.uid), {
      name: "Uniluva Oficial",
      handle: "@uniluva",
      bio: "Cuenta oficial de Uniluva. Conecta. Descubre. Aporta.",
      email: currentUser.email || "",
      photoURL: currentUser.photoURL || "",
      joinedCommunities: communities.map(c => c.name),
      role: "official",
      updatedAt: serverTimestamp()
    }, { merge: true });
    log("✓ Perfil oficial actualizado");

    for (const c of communities) {
      await setDoc(doc(db, "communities", c.id), {
        name: c.name,
        description: c.description,
        createdBy: currentUser.uid,
        createdAt: serverTimestamp(),
        status: "active"
      }, { merge: true });
      log("✓ Comunidad: " + c.name);
    }

    for (let i = 0; i < posts.length; i++) {
      const p = posts[i];
      await addDoc(collection(db, "posts"), {
        text: p.text,
        author: "Uniluva Oficial",
        user: "@uniluva",
        initial: "N",
        community: p.community,
        likes: 0,
        value: 0,
        help: 0,
        comments: [],
        authorId: currentUser.uid,
        createdAt: serverTimestamp(),
        editorial: true,
        source: "Uniluva Oficial"
      });
      log(`✓ Publicación ${i+1}/${posts.length} · ${p.community}`);
    }

    log("\nLISTO: se cargaron " + communities.length + " comunidades y " + posts.length + " publicaciones.");
  } catch (err) {
    console.error(err);
    log("\nERROR: " + (err.code || err.message));
    seedBtn.disabled = false;
  }
};
</script>
</body>
</html>
