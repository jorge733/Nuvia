<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Uniluva — En mantenimiento</title>
  <style>
    :root { --bg: #f7f7f8; --fg: #1d1d1f; --muted: #6e6e73; --accent: #6c4cf5; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #111113; --fg: #f2f2f4; --muted: #a1a1a8; --accent: #9b85ff; }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: grid; place-items: center; padding: 24px 16px;
      background: var(--bg); color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      text-align: center;
    }
    main { max-width: 440px; }
    .dot {
      width: 14px; height: 14px; margin: 0 auto 28px; border-radius: 50%;
      background: var(--accent); animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100% { opacity: .35; transform: scale(.85); } 50% { opacity: 1; transform: scale(1); } }
    @media (prefers-reduced-motion: reduce) { .dot { animation: none; } }
    h1 { font-size: clamp(1.6rem, 5vw, 2.2rem); margin: 0 0 12px; letter-spacing: -.02em; }
    p { margin: 0; color: var(--muted); line-height: 1.6; font-size: 1.05rem; }
  </style>
</head>
<body>
  <main>
    <div class="dot" aria-hidden="true"></div>
    <h1>Estamos en mantenimiento</h1>
    <p>Uniluva se está renovando. Volveremos pronto con algo nuevo.</p>
  </main>
  <script>
    // Quita el service worker y la caché de la versión anterior para que nadie vea la app antigua.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (regs) { regs.forEach(function (r) { r.unregister(); }); });
    }
    if (window.caches) { caches.keys().then(function (keys) { keys.forEach(function (k) { caches.delete(k); }); }); }
  </script>
</body>
</html>
